{% extends 'base.html' %}{% block content %}<div class="auth-card"><h1>Entrar no UniTask</h1><p>Acesse sua conta para gerenciar seus dados.</p>
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email" required>
<label for="password">Senha</label><input type="password" id="password" name="password" autocomplete="current-password" required>
<button type="submit" class="button">Entrar</button></form><p>Não tem uma conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p></div>{% endblock %}
